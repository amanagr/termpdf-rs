<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- terminal frame -->
  <rect x="60" y="60" width="1080" height="510" rx="14" fill="#010409" stroke="#30363d" stroke-width="2"/>
  <circle cx="92" cy="92" r="7" fill="#ff5f56"/>
  <circle cx="116" cy="92" r="7" fill="#ffbd2e"/>
  <circle cx="140" cy="92" r="7" fill="#27c93f"/>
  <line x1="60" y1="118" x2="1140" y2="118" stroke="#30363d" stroke-width="1"/>

  <!-- title -->
  <text x="100" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="56" font-weight="700" fill="#e6edf3">termpdf-rs</text>
  <text x="100" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" fill="#7d8590">a PDF reader that lives in your terminal</text>

  <!-- subtitle bullets -->
  <text x="100" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#7ee787">$</text>
  <text x="132" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#e6edf3">vim keys · kitty-native pixel-perfect pages · indexed search</text>
  <text x="100" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#7ee787">$</text>
  <text x="132" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#e6edf3">single-digit CPU on a held-j · Linux + Rust</text>

  <!-- CPU comparison block -->
  <rect x="100" y="424" width="1000" height="116" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="124" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#7d8590">scroll CPU on a 600-page book</text>

  <text x="124" y="510" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="700" fill="#7ee787">7.5%</text>
  <text x="232" y="510" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#e6edf3">termpdf-rs</text>

  <text x="500" y="510" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="700" fill="#f85149">66%</text>
  <text x="600" y="510" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#e6edf3">Firefox</text>

  <text x="900" y="510" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#d2a8ff">9× lower</text>
</svg>
