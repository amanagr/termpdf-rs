[package]
name = "termpdf-rs"
version = "0.1.0"
edition = "2021"
description = "Terminal PDF reader with Kitty graphics + dark mode"
license = "MIT"
repository = "https://github.com/amanagr/termpdf-rs"
default-run = "termpdf"

[[bin]]
name = "termpdf"
path = "src/main.rs"

[dependencies]
# PDF rendering. Default features enable dynamic dlopen of libpdfium
# at runtime, image-crate integration, and a thread-safe mutex
# wrapper. `setup.sh` stages a prebuilt libpdfium.so in vendor/.
# Stay on 0.9.x: 0.9.0 was a major cleanup that removed all
# previously-deprecated APIs and added Send+Sync everywhere. Don't
# bump past 0.9 without auditing for the next breaking release.
pdfium-render = "0.9"

# TUI + Kitty/Sixel image embedding. ratatui-image picks the best
# graphics protocol the terminal advertises; on Ghostty it lands on
# the Kitty protocol, which is what we want for pixel-perfect output.
#
# ratatui-image 10 pins ratatui ^0.30, so we match. Mismatching here
# causes two copies of `StatefulWidget` to coexist — same name, same
# shape, different traits — and `StatefulImage` only implements one of
# them. The error message ("similarly named trait") is the tell.
ratatui = "0.30"
# Skip chafa-dyn (the default) — chafa is the halfblocks fallback
# renderer for terminals without kitty/sixel, and it pulls in
# libchafa-devel as a system dep. Ghostty speaks kitty natively, so
# we don't need chafa. Also skip image-defaults (which would re-enable
# image's full codec stack) — see the `image` line below.
ratatui-image = { version = "10", default-features = false, features = ["crossterm"] }
crossterm = "0.29"

# Color-aware dark mode + on-the-wire PNG encode + cached page
# decode. We only ever encode/decode PNG (page bitmap → kitty
# transmit; cached page bitmap on disk). image's default features
# pull in the entire codec stack including rav1e/ravif (AV1) and a
# wasm toolchain — ~50 transitive crates of build.rs / unsafe C-like
# code that we never call into. default-features = false + just
# "png" trims that supply-chain surface. Also drops the
# unmaintained `paste 1.0.15` (RUSTSEC-2024-0436) which arrives
# transitively through ravif → rav1e.
image = { version = "0.25", default-features = false, features = ["png"] }
palette = { version = "0.7", default-features = false, features = ["std"] }

# CLI parsing + JSON for highlight persistence.
# clap: wrap_help gives sensible long-help wrapping on narrow terms.
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# dirs 6 is the maintained line; 5→6 is a transparent bump for our
# use of `data_local_dir()`.
dirs = "6"
base64 = "0.22"
# zlib for kitty graphics `o=z` compressed RGB transmit. flate2 is
# already in the tree transitively (via the image crate's PNG path);
# adding it as a direct dep is essentially free in compile time.
# Used in src/kitty_pages.rs::encode_rgb_zlib to replace the PNG
# encode for opaque page bitmaps — same zlib core as PNG, but
# without PNG's filtering pass, so encode is ~3× faster and Ghostty
# decodes to RGB directly (no PNG parser, no alpha plane).
flate2 = "1"

[dev-dependencies]
# PTY-driven integration tests. Spawns the built `termpdf` binary
# inside a fake pty so we can drive keystrokes and capture every
# byte the renderer writes — the only way to verify, without a
# human watching the screen, that the kitty graphics + selection
# overlay actually reaches the wire (and not just the ratatui
# buffer). Heavy dep, kept dev-only.
portable-pty = "0.9"
# Property-based tests for the kitty page registry's state machine
# (LRU + cache + pending_deletes). Drives randomized sequences of
# transmit/mark/evict/invalidate ops and asserts invariants after
# each op. `regex` is default-on but unused by us (we don't write
# string-shaped Strategies) — no clean way to exclude it without
# dropping `std`, which we want for `PROPTEST_CASES` env-var
# support and `proptest-regressions/` replay of past counterexamples.
proptest = "1"

[profile.release]
# Smaller binary, no measurable perf loss for our workload.
lto = "thin"
codegen-units = 1
strip = "symbols"
# eza/yazi/fd pattern: drop unwind tables and panic=unwind machinery.
# Saves 5-10% binary size and a tiny startup cost. We don't use
# `catch_unwind` anywhere in src/ — the only consumer is std's panic
# hook which still fires (we install our own to clear DECSET 2026
# before exit). dev-dependency PTY tests run in a separate process so
# they're unaffected.
panic = "abort"
